# Sitio de ChivoMed (frontend) en el contenedor galeno.frontend.
# La SPA llega por el volumen en /var/www/html (la carpeta src).
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    # DNS interno de Docker. Con proxy_pass a una variable, nginx resuelve galeno.backend en cada
    # petición y no al arrancar: si el frontend arranca antes que el backend, nginx no falla.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://galeno.backend:9080;

    # API REST (y pantallas JSF) del backend. El navegador solo conoce http://localhost, no
    # galeno.backend, y el backend no implementa CORS: todo pasa por aquí (mismo origen).
    # Sin URI en proxy_pass se reenvía la ruta original (/galeno/api/...).
    # Host = $http_host (con puerto, si lo hay): el backend compara el Origin con su propia URL,
    # que arma con el Host; si no coinciden, los POST/PUT/DELETE dan 403 auth.origen.
    location /galeno/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El service worker siempre se revalida, para que una versión nueva se detecte enseguida.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Manifiesto de la PWA con su tipo MIME.
    location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # SPA: las rutas van por hash, pero cualquier ruta desconocida devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
